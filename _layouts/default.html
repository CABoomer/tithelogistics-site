<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="24" height="24">
        {{ site.title }}
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}#demo">Demo</a>
        <a href="{{ '/' | relative_url }}#pricing">Pricing</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
      </nav>
    </div>
  </header>

  <main class="wrap {% if page.prose %}prose{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ 'now' | date: '%Y' }} {{ site.legal_name }}</span>
      <span>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a> ·
        <a href="{{ '/terms/' | relative_url }}">Terms of Service</a> ·
        <a href="mailto:{{ site.support_email }}">{{ site.support_email }}</a>
      </span>
    </div>
  </footer>
</body>
</html>
